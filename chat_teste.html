<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬 Chat — API Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; }
  /* LOGIN */
  #login { max-width: 380px; margin: auto; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; width: 90%; }
  #login h1 { font-size: 20px; margin-bottom: 16px; text-align: center; }
  input, button { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 14px; }
  button { background: #238636; border: none; cursor: pointer; font-weight: bold; }
  button:hover { background: #2ea043; }
  .dica { font-size: 11px; color: #8b949e; margin-top: 8px; line-height: 1.5; }
  /* CHAT */
  #chatApp { display: none; flex: 1; flex-direction: column; max-width: 800px; width: 100%; margin: 0 auto; }
  header { padding: 10px 14px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 10px; }
  header b { color: #58a6ff; }
  #meuCargo { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #30363d; }
  #meuCargo.mod { background: #1f6feb; } #meuCargo.admin { background: #da3633; }
  header button { width: auto; padding: 5px 12px; margin: 0 0 0 auto; background: #30363d; font-weight: normal; }
  #msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 7px 10px; font-size: 14px; word-break: break-word; }
  .msg .hora { color: #8b949e; font-size: 11px; margin-right: 6px; }
  .tag { font-size: 10px; font-weight: bold; padding: 1px 6px; border-radius: 6px; margin-right: 5px; vertical-align: middle; }
  .tag.mod { background: #1f6feb; } .tag.admin { background: #da3633; }
  .nick { font-weight: bold; color: #58a6ff; }
  .msg.grito { border-color: #f85149; background: #2d0f0f; font-size: 17px; font-weight: bold; }
  .msg.grito .texto { color: #ff7b72; }
  .msg.pm { border-color: #a371f7; background: #1c1130; }
  .msg.pm .texto { color: #d2a8ff; }
  .msg.pm .nick { color: #a371f7; }
  .msg.sistema { background: transparent; border: none; text-align: center; color: #f0b429; font-size: 12px; font-style: italic; }
  #barra { padding: 10px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 8px; }
  #barra input { flex: 1; margin: 0; }
  #barra button { width: auto; padding: 10px 20px; margin: 0; }
  #comandos { max-width: 800px; width: 100%; margin: 0 auto; padding: 8px 14px; font-size: 12px; color: #8b949e; background: #010409; border-top: 1px solid #21262d; }
  #comandos code { color: #58a6ff; }
  #toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: #da3633; padding: 8px 18px; border-radius: 8px; font-size: 13px; display: none; z-index: 99; }
</style>
</head>
<body>

<div id="login">
  <h1>💬 Chat API Game</h1>
  <input id="nick" placeholder="Nick">
  <input id="cod_token" placeholder="cod_token">
  <button onclick="entrar()">Entrar no chat</button>
  <p class="dica">Crie uma conta na página <b>/teste</b> se ainda não tiver.<br>Seu login fica salvo neste navegador.</p>
</div>

<div id="chatApp">
  <header>
    <span>💬 <b id="nickTopo"></b></span>
    <span id="meuCargo">user</span>
    <button onclick="sair()">Sair</button>
  </header>
  <div id="msgs"></div>
  <div id="comandos">
    Comandos: <code>/pm @nick msg</code> · <code>/grito msg</code> · mod+: <code>/banir @nick</code> <code>/removermsgs N</code> · admin: <code>/cooldown N</code> <code>/promover @nick mod|admin|usuario</code>
  </div>
  <div id="barra">
    <input id="texto" placeholder="Mensagem ou comando..." onkeydown="if(event.key==='Enter')enviar()">
    <button onclick="enviar()">Enviar</button>
  </div>
</div>

<div id="toast"></div>

<script>
const API = window.location.protocol === "file:" || window.location.origin.includes("localhost")
  ? "https://api-jogo-1.onrender.com"
  : window.location.origin;

const CARGOS = { 0: "user", 1: "mod", 2: "admin" };
let cod_token = localStorage.getItem("cod_token") || "";
let nick = localStorage.getItem("nick") || "";
let aposId = 0, pollTimer = null, entrando = false;

document.getElementById("nick").value = nick;
document.getElementById("cod_token").value = cod_token;
if (cod_token && nick) entrar();

function toast(msg, cor = "#da3633") {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.background = cor; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 3500);
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

async function entrar() {
  if (entrando) return; entrando = true;
  nick = document.getElementById("nick").value.trim();
  cod_token = document.getElementById("cod_token").value.trim();
  const r = await fetch(API + "/usuarios/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cod_token, nick })
  });
  if (!r.ok) { toast("Login inválido! Verifique nick e cod_token."); entrando = false; return; }
  const u = await r.json();
  localStorage.setItem("cod_token", cod_token);
  localStorage.setItem("nick", nick);
  document.getElementById("login").style.display = "none";
  document.getElementById("chatApp").style.display = "flex";
  document.getElementById("nickTopo").textContent = u.nick;
  const cargoEl = document.getElementById("meuCargo");
  cargoEl.textContent = CARGOS[u.nivel_acesso] || "user";
  cargoEl.className = cargoEl.textContent;
  aposId = 0;
  document.getElementById("msgs").innerHTML = "";
  poll(); 
  pollTimer = setInterval(poll, 2000);
  entrando = false;
}

function sair() {
  clearInterval(pollTimer);
  localStorage.removeItem("cod_token"); localStorage.removeItem("nick");
  location.reload();
}

async function poll() {
  try {
    const r = await fetch(`${API}/chat/mensagens?apos_id=${aposId}&cod_token=${encodeURIComponent(cod_token)}&nick=${encodeURIComponent(nick)}`);
    if (!r.ok) { if (r.status === 401) { toast("Sessão expirada."); sair(); } return; }
    const msgs = await r.json();
    for (const m of msgs) { renderMsg(m); aposId = Math.max(aposId, m.id); }
  } catch (e) { /* rede falhou — tenta no próximo poll */ }
}

function renderMsg(m) {
  const box = document.getElementById("msgs");
  const hora = new Date(m.ts * 1000).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  let tag = "";
  if (m.cargo === "mod") tag = '<span class="tag mod">[MOD]</span>';
  if (m.cargo === "admin") tag = '<span class="tag admin">[ADMIN]</span>';
  let html = "";
  if (m.tipo === "sistema") {
    html = `<div class="msg sistema">${esc(m.texto)}</div>`;
  } else if (m.tipo === "grito") {
    html = `<div class="msg grito"><span class="hora">${hora}</span>${tag}<span class="nick">${esc(m.nick)}</span> 📢 <span class="texto">${esc(m.texto)}</span></div>`;
  } else if (m.tipo === "pm") {
    html = `<div class="msg pm"><span class="hora">${hora}</span>🔒 <span class="nick">${esc(m.nick)}</span> → <b>${esc(m.destinatario)}</b>: <span class="texto">${esc(m.texto)}</span></div>`;
  } else {
    html = `<div class="msg"><span class="hora">${hora}</span>${tag}<span class="nick">${esc(m.nick)}</span>: <span class="texto">${esc(m.texto)}</span></div>`;
  }
  box.insertAdjacentHTML("beforeend", html);
  box.scrollTop = box.scrollHeight;
}

async function enviar() {
  const campo = document.getElementById("texto");
  const texto = campo.value.trim();
  if (!texto) return;
  campo.value = "";
  const r = await fetch(API + "/chat/enviar", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cod_token, nick, texto })
  });
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) {
    toast(dados.detail || "Erro ao enviar.");
    campo.value = texto; // devolve o texto pra tentar de novo
    return;
  }
  if (dados.comando) toast(dados.msg, "#238636");
  poll(); // puxa na hora em vez de esperar o intervalo
}
</script>
</body>
</html>

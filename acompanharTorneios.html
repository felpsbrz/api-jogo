<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhar Torneios</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #0d1117; color: #e6edf3; min-height: 100vh; padding: 20px; }
  h1 { text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; color: #8b949e; font-size: 13px; margin-bottom: 20px; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { font-size: 17px; color: #58a6ff; word-break: break-word; }
  .meta { display: flex; justify-content: space-between; font-size: 13px; color: #8b949e; }
  .meta b { color: #f0b429; }
  button { padding: 10px 14px; border-radius: 8px; border: none; background: #1f6feb; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; transition: .15s; }
  button:hover { background: #388bfd; }
  button.voltar { background: #30363d; margin-bottom: 14px; }
  button.voltar:hover { background: #484f58; }
  .tag { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
  .t-aberto { background: #1f6feb33; color: #58a6ff; }
  .t-andamento { background: #9e6a0333; color: #d29922; }
  .t-finalizado { background: #3fb95033; color: #3fb950; }
  .t-off { background: #f8514933; color: #f85149; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .vazio { color: #8b949e; text-align: center; padding: 30px 0; }
  .cab { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .cab h2 { font-size: 22px; color: #58a6ff; margin-bottom: 10px; word-break: break-word; }
  .infos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .info { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px; text-align: center; }
  .info b { display: block; font-size: 18px; color: #f0b429; word-break: break-word; }
  .info span { font-size: 11px; color: #8b949e; }
  .campeao { margin-top: 12px; background: #3fb95022; border: 1px solid #3fb950; color: #3fb950; border-radius: 8px; padding: 12px; text-align: center; font-weight: bold; }
  .chave { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 16px; overflow-x: auto; padding-bottom: 8px; }
  .fase { display: flex; flex-direction: column; justify-content: space-around; gap: 14px; }
  .fase h3 { text-align: center; font-size: 13px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
  .partida { background: #161b22; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
  .partida.atual { border-color: #d29922; box-shadow: 0 0 0 1px #d29922; }
  .partida .topo { display: flex; justify-content: space-between; font-size: 11px; color: #8b949e; padding: 6px 10px; background: #0d1117; }
  .jog { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-top: 1px solid #21262d; font-size: 14px; min-height: 40px; word-break: break-all; gap: 8px; }
  .jog.venceu { color: #3fb950; font-weight: bold; background: #3fb95015; }
  .jog.perdeu { color: #f85149; background: #f8514912; text-decoration: line-through; }
  .jog.espera { color: #8b949e; font-style: italic; }
  .pronto { font-size: 11px; color: #3fb950; white-space: nowrap; }
  .live { text-align: center; font-size: 12px; color: #8b949e; margin-top: 12px; }
  .live i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3fb950; margin-right: 6px; animation: p 1.2s infinite; }
  @keyframes p { 50% { opacity: .25; } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Acompanhar Torneios</h1>
    <p class="sub">Escolha um torneio e acompanhe a tabela em tempo real</p>
    <div id="app"></div>
  </div>

<script>
const API = window.location.protocol === "file:"
  ? "https://api-jogo-1.onrender.com"
  : window.location.origin;

const INTERVALO = 3000;
let tela = "lista";
let atualId = 0;
let timer = null;
let estado = null;
let fimPrazo = 0;
let tick = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function get(rota) {
  try {
    const r = await fetch(API + rota);
    const d = await r.json().catch(() => ({}));
    return r.ok ? d : { erro: d.detail || "Erro " + r.status };
  } catch (e) {
    return { erro: "Sem conexão com o servidor." };
  }
}

function parar() {
  clearTimeout(timer);
  clearInterval(tick);
  timer = null;
  tick = null;
}

function rotuloStatus(s) {
  return s === "aberto" ? "Aberto" : s === "andamento" ? "Em andamento" : "Finalizado";
}

async function mostrarLista() {
  parar();
  tela = "lista";
  atualId = 0;
  const r = await get("/torneios");
  if (tela !== "lista") return;
  const app = document.getElementById("app");
  if (r.erro) {
    app.innerHTML = `<p class="vazio">${esc(r.erro)}</p>`;
  } else if (!r.torneios.length) {
    app.innerHTML = '<p class="vazio">Nenhum torneio criado ainda.</p>';
  } else {
    app.innerHTML = '<div class="cards">' + r.torneios.map(t => `
      <div class="card">
        <h2>${esc(t.nome)}</h2>
        <div class="tags">
          <span class="tag t-${esc(t.status)}">${rotuloStatus(t.status)}</span>
          ${t.ativo === false ? '<span class="tag t-off">Desativado</span>' : ""}
        </div>
        <div class="meta"><span>Prêmio: <b>${t.premio} 💎</b></span><span>Inscritos: <b>${t.inscritos}/8</b></span></div>
        <button onclick="verTorneio(${t.id})">Ver tabela do torneio</button>
      </div>`).join("") + "</div>";
  }
  timer = setTimeout(mostrarLista, 5000);
}

function verTorneio(id) {
  parar();
  tela = "torneio";
  atualId = id;
  estado = null;
  document.getElementById("app").innerHTML = '<p class="vazio">Carregando...</p>';
  carregar();
}

async function carregar() {
  const id = atualId;
  const r = await get("/torneios/" + id);
  if (tela !== "torneio" || id !== atualId) return;
  if (r.erro) {
    document.getElementById("app").innerHTML = `<button class="voltar" onclick="mostrarLista()">← Voltar</button><p class="vazio">${esc(r.erro)}</p>`;
  } else {
    estado = r;
    fimPrazo = Date.now() + r.restante * 1000;
    desenhar();
    clearInterval(tick);
    tick = setInterval(atualizarRelogio, 500);
  }
  timer = setTimeout(carregar, INTERVALO);
}

function atualizarRelogio() {
  const el = document.getElementById("relogio");
  if (!el || !estado || estado.status !== "andamento") return;
  const s = Math.max(0, Math.ceil((fimPrazo - Date.now()) / 1000));
  el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + "s";
}

function jogador(nome, p, lado) {
  if (!nome) return '<div class="jog espera"><span>Aguardando...</span></div>';
  let cls = "";
  if (p.vencedor) cls = nome === p.vencedor ? "venceu" : "perdeu";
  const pronto = (lado === "a" ? p.pronto_a : p.pronto_b) && !p.vencedor ? '<span class="pronto">✔ pronto</span>' : "";
  const coroa = cls === "venceu" ? " 🏆" : "";
  return `<div class="jog ${cls}"><span>${esc(nome)}${coroa}</span>${pronto}</div>`;
}

function partida(p, e) {
  const atual = e.status === "andamento" && p.ordem === e.atual;
  let topo = "Aguardando";
  if (p.vencedor) topo = "Finalizada";
  else if (atual) topo = "Em jogo";
  return `<div class="partida ${atual ? "atual" : ""}">
    <div class="topo"><span>Partida ${p.ordem}</span><span>${topo}</span></div>
    ${jogador(p.a, p, "a")}
    ${jogador(p.b, p, "b")}
  </div>`;
}

function desenhar() {
  const e = estado;
  const ps = e.partidas;
  let faixa = "";
  if (e.status === "finalizado") {
    faixa = `<div class="campeao">🏆 Campeão: ${esc(e.vencedor)} — prêmio de ${e.premio} 💎 pago</div>`;
  }
  const premioTxt = e.status === "finalizado" ? "Pago" : "A pagar ao campeão";
  const prazo = e.status === "andamento"
    ? `<div class="info"><b id="relogio">–</b><span>TEMPO DA PARTIDA ${e.atual}</span></div>` : "";
  document.getElementById("app").innerHTML = `
    <button class="voltar" onclick="mostrarLista()">← Voltar para a lista</button>
    <div class="cab">
      <h2>${esc(e.nome)}</h2>
      <div class="tags">
        <span class="tag t-${esc(e.status)}">${rotuloStatus(e.status)}</span>
        ${e.ativo === false ? '<span class="tag t-off">Desativado</span>' : ""}
      </div>
      <div class="infos">
        <div class="info"><b>${e.premio} 💎</b><span>PRÊMIO</span></div>
        <div class="info"><b>${premioTxt}</b><span>PREMIAÇÃO</span></div>
        <div class="info"><b>${e.inscritos}/8</b><span>INSCRITOS</span></div>
        <div class="info"><b>${esc(e.criador)}</b><span>CRIADOR</span></div>
        ${e.status === "andamento" ? `<div class="info"><b>${e.atual}/7</b><span>PARTIDA ATUAL</span></div>` : ""}
        ${prazo}
      </div>
      ${faixa}
    </div>
    <div class="chave">
      <div class="fase"><h3>Quartas de final</h3>${ps.slice(0, 4).map(p => partida(p, e)).join("")}</div>
      <div class="fase"><h3>Semifinais</h3>${ps.slice(4, 6).map(p => partida(p, e)).join("")}</div>
      <div class="fase"><h3>Final</h3>${ps.slice(6, 7).map(p => partida(p, e)).join("")}</div>
    </div>
    <p class="live"><i></i>Atualizando em tempo real a cada ${INTERVALO / 1000}s</p>`;
  atualizarRelogio();
}

mostrarLista();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬 Chat do Jogo</title>
<style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #1a1a2e; color: #eee; margin: 0; height: 100vh; display: flex; justify-content: center; }
    #app { width: 100%; max-width: 700px; display: flex; flex-direction: column; height: 100vh; }

    /* LOGIN */
    #login { margin: auto; background: #16213e; padding: 30px; border-radius: 12px; text-align: center; width: 90%; }
    #login h1 { margin-top: 0; }
    #login input { display: block; width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: none; }
    #login button { width: 100%; padding: 10px; margin-top: 6px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #btn-entrar { background: #4ecca3; }
    #btn-criar { background: #3498db; color: #fff; }
    #login-erro { color: #e94560; min-height: 20px; }

    /* CHAT */
    #chat { display: none; flex-direction: column; height: 100vh; }
    #chat-header { background: #0f3460; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
    #chat-header .info { font-size: 14px; }
    #cargo-admin { color: #f5a623; font-weight: bold; }
    #cargo-mod { color: #3498db; font-weight: bold; }
    #msgs { flex: 1; overflow-y: auto; padding: 12px; background: #16213e; }
    .msg { padding: 6px 10px; margin: 4px 0; border-radius: 8px; background: #1a1a2e; }
    .msg .nick { font-weight: bold; color: #4ecca3; margin-right: 6px; }
    .msg-sistema { background: #0f3460; color: #f5a623; font-style: italic; text-align: center; }
    .msg-grito { background: #5c1a1a; border: 1px solid #e94560; }
    .msg-grito .texto { color: #ff6b6b; font-weight: bold; font-size: 1.15em; }
    .msg-pm { background: #2a1a3e; border: 1px solid #9b59b6; }
    .msg-pm .nick { color: #c39bd3; }
    .msg-pm .texto { color: #d7bde2; font-style: italic; }
    #enviar-area { display: flex; padding: 10px; background: #0f3460; gap: 8px; }
    #enviar-area input { flex: 1; padding: 10px; border-radius: 6px; border: none; }
    #btn-enviar { padding: 10px 20px; background: #4ecca3; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #status { padding: 4px 12px; font-size: 12px; color: #aaa; background: #0f3460; }
    #dicas { font-size: 11px; color: #888; padding: 4px 12px; background: #0f3460; }
</style>
</head>
<body>
<div id="app">

    <!-- TELA DE LOGIN -->
    <div id="login">
        <h1>💬 Chat do Jogo</h1>
        <input id="l_nick" placeholder="Seu nick" autocomplete="off">
        <input id="l_senha" type="password" placeholder="Senha">
        <button id="btn-entrar" onclick="entrar()">Entrar</button>
        <button id="btn-criar" onclick="criarConta()">Criar conta</button>
        <p id="login-erro"></p>
    </div>

    <!-- TELA DO CHAT -->
    <div id="chat">
        <div id="chat-header">
            <div class="info">💬 Chat | <span id="meu-nick"></span> <span id="meu-cargo"></span></div>
            <div class="info">⏱ cooldown: <span id="cd-info">30</span>s</div>
        </div>
        <div id="msgs"></div>
        <div id="status"></div>
        <div id="dicas">Comandos: /grito "msg" • /pm @nick msg • (mod) /banir @nick • /removermsgs 5 • (admin) /coldown 60</div>
        <div id="enviar-area">
            <input id="campo-msg" placeholder="Digite sua mensagem..." autocomplete="off" onkeydown="if(event.key==='Enter')enviar()">
            <button id="btn-enviar" onclick="enviar()">Enviar</button>
        </div>
    </div>
</div>

<script>
const API = window.location.origin;
let TOKEN = null, MEU_NICK = "", ULTIMO_ID = 0, POLL = null;

function status(txt, cor) {
    const el = document.getElementById("status");
    el.textContent = txt;
    el.style.color = cor || "#aaa";
}

async function api(metodo, rota, corpo) {
    const op = { method: metodo, headers: { "Content-Type": "application/json" } };
    if (TOKEN) op.headers["Authorization"] = "Bearer " + TOKEN;
    if (corpo) op.body = JSON.stringify(corpo);
    const resp = await fetch(API + rota, op);
    const dados = await resp.json().catch(() => ({}));
    if (!resp.ok) throw { status: resp.status, dados };
    return dados;
}

// ── LOGIN / CRIAR CONTA ──
async function entrar() {
    try {
        const d = await api("POST", "/login", {
            nick: l_nick.value.trim(), senha: l_senha.value
        });
        iniciarChat(d);
    } catch (e) { loginErro(e.dados.detail || "Falha no login"); }
}

async function criarConta() {
    try {
        const d = await api("POST", "/jogadores", {
            nick: l_nick.value.trim(), senha: l_senha.value
        });
        if (d.erro) return loginErro(d.erro);
        d.cooldown = 30;
        iniciarChat(d);
    } catch (e) { loginErro(e.dados.detail || "Erro ao criar conta"); }
}

function loginErro(msg) {
    document.getElementById("login-erro").textContent = "⚠️ " + msg;
}

function iniciarChat(d) {
    TOKEN = d.token; MEU_NICK = d.nick;
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";
    document.getElementById("meu-nick").textContent = d.nick;
    const cargoEl = document.getElementById("meu-cargo");
    if (d.cargo === "admin") { cargoEl.textContent = "👑 admin"; cargoEl.id = "cargo-admin"; }
    else if (d.cargo === "mod") { cargoEl.textContent = "🛡️ mod"; cargoEl.id = "cargo-mod"; }
    document.getElementById("cd-info").textContent = d.cooldown || 30;
    carregarTudo();
    POLL = setInterval(carregarNovas, 2500);
}

// ── CHAT ──
function escapar(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function addMsg(m) {
    const div = document.createElement("div");
    if (m.tipo === "grito") {
        div.className = "msg msg-grito";
        div.innerHTML = `<span class="nick">📢 ${escapar(m.nick)}:</span><span class="texto">${escapar(m.texto)}</span>`;
    } else if (m.tipo === "pm") {
        div.className = "msg msg-pm";
        div.innerHTML = `<span class="nick">🔒 PM ${escapar(m.nick)} → ${escapar(m.destinatario)}:</span><span class="texto">${escapar(m.texto)}</span>`;
    } else {
        div.className = "msg";
        div.innerHTML = `<span class="nick">${escapar(m.nick)}:</span><span>${escapar(m.texto)}</span>`;
    }
    const box = document.getElementById("msgs");
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

function addSistema(txt) {
    const div = document.createElement("div");
    div.className = "msg msg-sistema";
    div.textContent = txt;
    const box = document.getElementById("msgs");
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

async function carregarTudo() {
    try {
        const msgs = await api("GET", "/chat/mensagens?apos_id=0");
        document.getElementById("msgs").innerHTML = "";
        msgs.forEach(addMsg);
        if (msgs.length) ULTIMO_ID = msgs[msgs.length - 1].id;
    } catch (e) { status("Erro ao carregar mensagens", "#e94560"); }
}

async function carregarNovas() {
    try {
        const msgs = await api("GET", "/chat/mensagens?apos_id=" + ULTIMO_ID);
        msgs.forEach(addMsg);
        if (msgs.length) ULTIMO_ID = msgs[msgs.length - 1].id;
    } catch (e) { /* silencioso pra não poluir */ }
}

async function enviar() {
    const campo = document.getElementById("campo-msg");
    const texto = campo.value.trim();
    if (!texto) return;
    campo.value = "";
    try {
        const d = await api("POST", "/chat/enviar", { texto });
        addSistema(d.msg || "OK");
    } catch (e) {
        const detalhe = e.dados && e.dados.detail ? e.dados.detail : "Erro ao enviar";
        addSistema("⚠️ " + detalhe);
    }
    carregarNovas();
}
</script>
</body>
</html>
